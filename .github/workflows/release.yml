name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Install the toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Isolate partial runner state, as the quality workflow does.
          RUSTUP_HOME=$(mktemp -d "$RUNNER_TEMP/ariadne-rustup.XXXXXX")
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          export RUSTUP_HOME
          rustup toolchain install 1.98.1 --profile minimal --component cargo --component rustc --component rust-std --component rustfmt --component clippy
          cargo --version
          rustc --version
          npm install --global npm@10.9.8
          npm ci --ignore-scripts --engine-strict
      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')
          case "$GITHUB_REF_NAME" in
            "v$version"*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not start with v$version, the app version." >&2; exit 1 ;;
          esac
      - name: Build the package
        run: make package
      - name: Verify the package in a temporary home
        shell: bash
        run: |
          set -euo pipefail
          verify=$(mktemp -d "$RUNNER_TEMP/verify.XXXXXX")
          fake_home=$(mktemp -d "$RUNNER_TEMP/home.XXXXXX")
          mkdir -p "$fake_home/.local/bin"
          tar -xzf dist/*.tar.gz -C "$verify"
          package=$(echo "$verify"/ariadne-*)
          cd "$package"
          HOME="$fake_home" ./install.sh
          HOME="$fake_home" "$fake_home/.local/bin/ariadne" doctor --json
          test -e "$fake_home/.local/bin/ariadne"
          # The app is a real bundle in ~/Applications, so Finder, Spotlight and Launchpad see it.
          test -x "$fake_home/Applications/Ariadne.app/Contents/MacOS/ariadne-desktop"
          test ! -L "$fake_home/Applications/Ariadne.app"
          HOME="$fake_home" python3 install.py uninstall
          test -z "$(ls -A "$fake_home/.local/share/ariadne/versions" 2>/dev/null)"
          for leftover in .local/bin/ariadne .local/bin/ariadne-mcp Applications/Ariadne.app .agents/skills/ariadne; do
            if [ -e "$fake_home/$leftover" ] || [ -L "$fake_home/$leftover" ]; then
              echo "Uninstall left $leftover behind." >&2
              exit 1
            fi
          done
      - name: Keep the package as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ariadne-package-${{ github.run_id }}
          path: dist/*.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Publish the pre-release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; tag a new alpha instead of re-running." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Alpha build for Apple Silicon Macs (macOS 13 or newer), not signed or
          notarized. To install: download the `.tar.gz`, run `tar xzf` on it, then
          `./install.sh` inside the folder it creates. It needs only python3 3.11 or
          newer. `install.sh` removes the macOS download quarantine mark from the
          package folder and says so; if macOS still refuses to open the app, go to
          System Settings → Privacy & Security and choose Open Anyway. Intel Macs and
          building from source: `make install` remains supported.
          NOTES
          gh release create "$GITHUB_REF_NAME" --prerelease --title "Ariadne $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*.tar.gz

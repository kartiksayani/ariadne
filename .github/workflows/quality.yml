name: Quality

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-policy:
    name: change-policy
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check PR source commits or main squash commits
        env:
          BASE_SHA: ${{ github.ref == 'refs/heads/main' && github.event.before || 'origin/main' }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "refs/heads/main" ]]; then
            args+=(--main)
          fi
          python3 scripts/check-change.py "${args[@]}"

  quality:
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: "${{ github.workspace }}/target/native-e2e"
    name: quality
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Check the pushed branch head
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(git rev-parse HEAD)
          archive_reports() {
            mkdir -p "$RUNNER_TEMP/ariadne-quality-evidence/$snapshot"
            if [[ -d coverage ]]; then cp -R coverage/. "$RUNNER_TEMP/ariadne-quality-evidence/$snapshot/"; fi
          }
          trap archive_reports EXIT
          rm -rf coverage
          npm install --global npm@10.9.8
          python -m venv .venv-quality
          .venv-quality/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version
          if [[ -f Cargo.toml ]]; then
            rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
            cargo install cargo-llvm-cov --version 0.9.1 --locked
          fi
          npm ci --ignore-scripts --engine-strict
          if [[ -f Cargo.toml ]]; then
            npm run build
            cargo build --workspace --locked --all-features
          fi
          .venv-quality/bin/python scripts/check-commit.py --ci
      - name: Preserve native and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ariadne-quality-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Record result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Quality result for $GITHUB_SHA — $JOB_STATUS. Pushed branch head must pass." >> "$GITHUB_STEP_SUMMARY"

name: Quality

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: "${{ github.workspace }}/target/native-e2e"
      BASE_SHA: ${{ github.ref == 'refs/heads/main' && github.event.before || 'origin/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Check the pushed branch head
        shell: bash
        run: |
          set -euo pipefail
          args=(--ci --base "$BASE_SHA")
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then args+=(--merge-base); fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then args+=(--full); fi
          scope=$(python scripts/check-commit.py "${args[@]}" --print-scope)
          npm install --global npm@10.9.8
          python -m venv .venv-quality
          .venv-quality/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --ignore-scripts --engine-strict
          if [[ "$scope" == application* ]]; then
            if [[ "$scope" == *" reference=true" ]]; then
              export PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/target/reference-browser"
              node node_modules/playwright/cli.js install chromium
              npm run capture:reference
            fi
            rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
            cargo install cargo-llvm-cov --version 0.9.1 --locked
          fi
          .venv-quality/bin/python scripts/check-commit.py "${args[@]}"
      - name: Preserve native and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
      - name: Record result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Quality result for $GITHUB_SHA — $JOB_STATUS. Pushed branch head must pass." >> "$GITHUB_STEP_SUMMARY"

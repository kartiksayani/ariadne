name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-policy:
    name: change-policy
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check each commit and the full change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check-change.py --base "$BASE_SHA" --head "$HEAD_SHA"

  quality:
    name: quality
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Check every PR commit and the integrated result
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          integration=$(git rev-parse HEAD)
          check_snapshot() {
            git checkout --detach "$1"
            python -m venv .venv-quality
            .venv-quality/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
            npm ci --ignore-scripts
            .venv-quality/bin/python scripts/check-commit.py --ci
          }
          if [[ -n "$HEAD_SHA" ]]; then
            while IFS= read -r revision; do
              check_snapshot "$revision"
            done < <(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")
          fi
          check_snapshot "$integration"
      - name: Record result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Quality result for $GITHUB_SHA — $JOB_STATUS. PR commits and integration must all pass." >> "$GITHUB_STEP_SUMMARY"

name: Quality

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    name: quality / ${{ matrix.stage }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        stage: [static, coverage, native]
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: "${{ github.workspace }}/target/native-e2e"
      BASE_SHA: ${{ github.ref == 'refs/heads/main' && github.event.before || 'origin/main' }}
      STAGE: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: true
      - name: Resolve the check scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          args=(--ci --base "$BASE_SHA")
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then args+=(--merge-base); fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then args+=(--full); fi
          scope=$(python scripts/check-commit.py "${args[@]}" --print-scope)
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "CHECK_ARGS=${args[*]}" >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        if: contains(steps.scope.outputs.scope, 'application')
        shell: bash
        run: |
          set -euo pipefail
          # Isolate partial runner state; fail before expensive reference captures.
          RUSTUP_HOME=$(mktemp -d "$RUNNER_TEMP/ariadne-rustup.XXXXXX")
          export RUSTUP_HOME
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.1 --profile minimal --component cargo --component rustc --component rust-std --component rustfmt --component clippy --component llvm-tools-preview
          cargo --version
          rustc --version
      - name: Restore cargo-llvm-cov
        id: llvm-cov-cache
        if: contains(steps.scope.outputs.scope, 'application') && matrix.stage == 'coverage'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-cargo-llvm-cov-0.9.1
      - name: Install cargo-llvm-cov
        if: contains(steps.scope.outputs.scope, 'application') && matrix.stage == 'coverage' && steps.llvm-cov-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Cache the Rust build
        if: contains(steps.scope.outputs.scope, 'application')
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.stage }}
          workspaces: ". -> target/native-e2e"
          cache-on-failure: true
      - name: Check the pushed branch head
        shell: bash
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          set -euo pipefail
          read -r -a args <<< "$CHECK_ARGS"
          npm install --global npm@10.9.8
          python -m venv .venv-quality
          .venv-quality/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --ignore-scripts --engine-strict
          .venv-quality/bin/python scripts/check-commit.py "${args[@]}" --stage "$STAGE"
          if [[ "$STAGE" == "static" && "$SCOPE" == *" reference=true" ]]; then
            export PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/target/reference-browser"
            node node_modules/playwright/cli.js install chromium
            npm run capture:reference
          fi
      - name: Preserve native and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.stage }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
  quality:
    name: quality
    needs: [stage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record result
        if: always()
        env:
          STAGE_RESULT: ${{ needs.stage.result }}
        run: |
          echo "Quality result for $GITHUB_SHA — $STAGE_RESULT. Pushed branch head must pass." >> "$GITHUB_STEP_SUMMARY"
          [[ "$STAGE_RESULT" == "success" ]]

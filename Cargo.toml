[workspace]
members = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = "=2.12.1"
tauri-build = "=2.7.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-wdio = "=1.4.0"
tauri-plugin-wdio-webdriver = "=1.4.0"
tempfile = "=3.27.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 1
lto = false

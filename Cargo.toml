[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/ariadne-domain",
    "crates/ariadne-store",
    "crates/ariadne-core",
    "crates/ariadne-agent-protocol",
    "crates/ariadne-runtime",
    "crates/ariadne-adapter-claude",
    "crates/ariadne-adapter-codex",
    "crates/ariadne-cli",
    "crates/ariadne-mcp",
    "tools/xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = "=2.12.1"
tauri-build = "=2.7.1"
tauri-plugin-wdio = "=1.4.0"
tauri-plugin-wdio-webdriver = "=1.4.0"
tempfile = "=3.27.0"
schemars = "=1.2.2"
ts-rs = "=12.0.1"
uuid = { version = "=1.26.1", default-features = false, features = ["std"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
jsonschema = { version = "=0.58.5", default-features = false }
typify = { version = "=0.5.0", default-features = false }
schemars08 = { package = "schemars", version = "=0.8.22" }
sha2 = "=0.10.9"
libc = "=0.2.190"

[patch.crates-io]
tauri-plugin-wdio-webdriver = { path = "vendor/tauri-plugin-wdio-webdriver" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 1
lto = false

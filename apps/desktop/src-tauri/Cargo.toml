[package]
name = "ariadne-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ariadne_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
ariadne-core = { path = "../../../crates/ariadne-core" }
ariadne-agent-protocol = { path = "../../../crates/ariadne-agent-protocol" }
ariadne-domain = { path = "../../../crates/ariadne-domain" }
ariadne-store = { path = "../../../crates/ariadne-store" }
ariadne-runtime = { path = "../../../crates/ariadne-runtime" }
ariadne-adapter-claude = { path = "../../../crates/ariadne-adapter-claude" }
ariadne-adapter-codex = { path = "../../../crates/ariadne-adapter-codex" }
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "sync", "time", "net"] }
uuid = { workspace = true, features = ["v4"] }
chrono.workspace = true
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "=2.5.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
url = "=2.5.8"
tauri-plugin-wdio = { workspace = true, optional = true }
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAlert", "NSApplication", "NSImage", "NSWindow", "NSPasteboard"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSNotification", "NSObject", "NSString", "NSOperation", "NSArray", "NSDictionary", "NSError", "NSData", "block2"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotification", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger"] }

[dev-dependencies]
ariadne-store = { path = "../../../crates/ariadne-store" }
ariadne-core = { path = "../../../crates/ariadne-core", features = ["test-support"] }
tauri = { workspace = true, features = ["test"] }

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

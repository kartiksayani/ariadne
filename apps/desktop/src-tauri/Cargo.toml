[package]
name = "ariadne-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ariadne_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
ariadne-core = { path = "../../../crates/ariadne-core" }
ariadne-domain = { path = "../../../crates/ariadne-domain" }
tauri.workspace = true
tauri-plugin-single-instance = { version = "=2.5.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
tempfile.workspace = true
tauri-plugin-wdio = { workspace = true, optional = true }
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }

[dev-dependencies]
ariadne-store = { path = "../../../crates/ariadne-store" }
ariadne-core = { path = "../../../crates/ariadne-core", features = ["test-support"] }
tauri = { workspace = true, features = ["test"] }

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

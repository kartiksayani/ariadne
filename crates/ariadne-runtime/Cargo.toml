[package]
name = "ariadne-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ariadne-adapter-claude = { path = "../ariadne-adapter-claude" }
ariadne-adapter-codex = { path = "../ariadne-adapter-codex" }
ariadne-core = { path = "../ariadne-core" }
ariadne-domain = { path = "../ariadne-domain" }
ariadne-agent-protocol = { path = "../ariadne-agent-protocol" }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
tokio = { version = "=1.53.1", default-features = false, features = ["net", "rt-multi-thread", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
ariadne-core = { path = "../ariadne-core", features = ["test-support"] }
ariadne-agent-protocol = { path = "../ariadne-agent-protocol", features = ["test-support"] }
tempfile.workspace = true

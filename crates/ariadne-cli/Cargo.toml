[package]
name = "ariadne-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ariadne-adapter-claude = { path = "../ariadne-adapter-claude" }
ariadne-adapter-codex = { path = "../ariadne-adapter-codex" }
ariadne-runtime = { path = "../ariadne-runtime" }
ariadne-core = { path = "../ariadne-core" }
ariadne-domain = { path = "../ariadne-domain" }
ariadne-store = { path = "../ariadne-store" }
ariadne-agent-protocol = { path = "../ariadne-agent-protocol" }
ariadne-mcp = { path = "../ariadne-mcp" }
serde_json.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
serde.workspace = true
ariadne-core = { path = "../ariadne-core", features = ["test-support"] }
tempfile.workspace = true

[[bin]]
name = "ariadne"
path = "src/main.rs"
